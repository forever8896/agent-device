name: Shake iOS diagnose
# Times the raw simctl shake call on Apple-silicon runners. Lives on this branch only.
on:
  push:
    branches: [shake-ios-diagnose]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          sw_vers; uname -m; xcodebuild -version
          xcrun simctl help | grep -i -E "notif|spawn" || true

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("node:fs").readFileSync(0, "utf8")).devices;
            const ios = Object.entries(d).filter(([r]) => r.includes("SimRuntime.iOS-")).sort(([a], [b]) => b.localeCompare(a, undefined, { numeric: true }));
            const phones = ios.flatMap(([runtime, list]) => list.filter((x) => x.name.startsWith("iPhone")).map((x) => ({ ...x, runtime })));
            const pick = phones.find((x) => /Pro$/.test(x.name)) ?? phones[0];
            if (!pick) process.exit(1);
            console.error(`Selected ${pick.name} (${pick.udid}) on ${pick.runtime}`);
            process.stdout.write(pick.udid);
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and install the shake counter app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ShakeCount.app"
          mkdir -p "$APP"
          xcrun -sdk iphonesimulator swiftc -parse-as-library \
            -target "$(uname -m)-apple-ios17.0-simulator" \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -module-name ShakeCount evidence/ios-shake-app/main.swift -o "$APP/ShakeCount"
          cp evidence/ios-shake-app/Info.plist "$APP/Info.plist"
          codesign --force --sign - "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" dev.shakecount
          sleep 5

      - name: Time the raw calls
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        shell: bash {0}
        run: |
          count() { cat "$(xcrun simctl get_app_container "$UDID" dev.shakecount data)/Documents/shakes.txt" 2>/dev/null || echo "?"; }
          # Runs a command with a wall-clock cap and prints how long it took.
          timed() {
            local cap="$1"; shift
            local start; start=$(date +%s)
            "$@" & local pid=$!
            ( sleep "$cap"; kill -9 "$pid" 2>/dev/null ) & local guard=$!
            wait "$pid"; local code=$?
            kill "$guard" 2>/dev/null || true
            echo "  -> exit $code after $(( $(date +%s) - start ))s: $*"
          }
          ROOT="$(xcrun simctl getenv "$UDID" SIMULATOR_ROOT)"
          ls -l "$ROOT/usr/bin/notifyutil" || echo "no notifyutil in runtime"
          file "$ROOT/usr/bin/notifyutil" || true
          echo "counter at start: $(count)"
          echo "== baseline spawn"
          timed 120 xcrun simctl spawn "$UDID" notifyutil -p dev.shakecount.baseline
          timed 120 xcrun simctl spawn "$UDID" notifyutil -p dev.shakecount.baseline
          for i in 1 2 3 4; do
            echo "== shake $i"
            timed 180 xcrun simctl spawn "$UDID" notifyutil -p com.apple.UIKit.SimulatorShake
            sleep 2
            echo "counter: $(count)"
          done
          echo "== unrelated notification"
          timed 120 xcrun simctl spawn "$UDID" notifyutil -p dev.shakecount.noop
          echo "== processes named notifyutil left behind"
          pgrep -fl notifyutil || echo none
