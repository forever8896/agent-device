name: Shake iOS evidence

# Live evidence for `agent-device shake` on an iOS simulator. Lives on the evidence branch only.
on:
  push:
    branches: [shake-ios-evidence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shake:
    name: shake on an iOS simulator (${{ matrix.os }})
    # macOS arm64 hosted runners are capacity-constrained; the Intel image queues separately.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SESSION: shake-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Select the newest installed Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          NEWEST="$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$NEWEST/Contents/Developer"

      - name: Host and source
        run: |
          sw_vers
          xcodebuild -version
          git log --oneline -3

      - name: Build the CLI
        run: pnpm build

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("node:fs").readFileSync(0, "utf8")).devices;
            const ios = Object.entries(d).filter(([r]) => r.includes("SimRuntime.iOS-")).sort(([a], [b]) => b.localeCompare(a, undefined, { numeric: true }));
            const phones = ios.flatMap(([runtime, list]) => list.filter((x) => x.name.startsWith("iPhone")).map((x) => ({ ...x, runtime })));
            const pick = phones.find((x) => /Pro$/.test(x.name)) ?? phones[0];
            if (!pick) process.exit(1);
            console.error(`Selected ${pick.name} (${pick.udid}) on ${pick.runtime}`);
            process.stdout.write(pick.udid);
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and install the shake counter app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ShakeCount.app"
          mkdir -p "$APP"
          xcrun -sdk iphonesimulator swiftc -parse-as-library \
            -target "$(uname -m)-apple-ios17.0-simulator" \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -module-name ShakeCount evidence/ios-shake-app/main.swift -o "$APP/ShakeCount"
          cp evidence/ios-shake-app/Info.plist "$APP/Info.plist"
          codesign --force --sign - "$APP"
          xcrun simctl install "$UDID" "$APP"

      - name: Build the iOS XCTest runner
        run: pnpm build:xcuitest:ios

      - name: Shake through agent-device and read the app's own counter
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          AD="node bin/agent-device.mjs"
          count() { cat "$(xcrun simctl get_app_container "$UDID" dev.shakecount data)/Documents/shakes.txt"; }
          mkdir -p evidence-out
          $AD open dev.shakecount --platform ios --udid "$UDID" --session "$SESSION"
          sleep 3
          echo "counter before: $(count)"
          test "$(count)" = 0
          xcrun simctl io "$UDID" screenshot evidence-out/before.png
          for expected in 1 2 3; do
            $AD shake --session "$SESSION" --json
            sleep 1
            echo "counter after shake $expected: $(count)"
            test "$(count)" = "$expected"
          done
          xcrun simctl io "$UDID" screenshot evidence-out/after.png

      # An extra reading, not the proof: the app's own counter above is. The XCTest runner can start
      # slowly on a hosted runner, so a timeout here does not fail the job.
      - name: Read the screen through agent-device snapshot
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          node bin/agent-device.mjs snapshot --session "$SESSION" | tee evidence-out/snapshot.txt
          grep -q 'Shakes: 3' evidence-out/snapshot.txt

      - name: Close the session
        if: always()
        run: node bin/agent-device.mjs close --session "$SESSION" || true

      - name: Upload screenshots and snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shake-ios-evidence-${{ matrix.os }}
          path: evidence-out
